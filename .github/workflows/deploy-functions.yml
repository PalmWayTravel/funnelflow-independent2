name: Deploy Supabase functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/migrations/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy all functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for d in supabase/functions/*/; do
            n=$(basename "$d"); [ "$n" = "_shared" ] && continue
            case "$n" in crmMetaLeadIntake) flag="--no-verify-jwt";; *) flag="";; esac
            supabase functions deploy "$n" --project-ref kvyebikebrwzpdvmmdch $flag
          done
